spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ams;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

ams:
  jwt:
    secret: test-jwt-secret-key-please-change-32bytes
    expire-hours: 8
  borrow:
    max-days: 90
  init:
    admin-password: Admin@123
    user-password: User@123
  mail:
    enabled: false
